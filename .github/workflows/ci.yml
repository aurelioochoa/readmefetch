name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pillow (for the GIF test; Chrome is preinstalled on GitHub's runners)
        run: python -m pip install --quiet "pillow>=10"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Package builds and installs
        run: |
          python -m pip install --quiet .
          readmefetch --version
          readmefetch logos computer --color never
