[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readmefetch"
version = "0.2.0"
description = "Your GitHub profile README as an animated, neofetch-style terminal: SVG, GIF, terminal output and a web editor"
readme = "README.md"
requires-python = ">=3.11"
# The code is MIT; bundled art keeps its own licence (see CREDITS.md).
license = "MIT AND BSD-3-Clause AND CC0-1.0 AND CC-BY-SA-3.0 AND Unlicense"
license-files = ["LICENSE", "CREDITS.md", "src/readmefetch/art/*/LICENSE*", "src/readmefetch/art/*/DISCLAIMER*"]
authors = [{ name = "Aurelio Ochoa" }]
keywords = ["neofetch", "readme", "github-profile", "svg", "ascii-art", "terminal"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
gif = ["pillow>=10"]
dev = ["pillow>=10", "ruff>=0.6"]

[project.scripts]
readmefetch = "readmefetch.cli:main"

[project.urls]
Homepage = "https://github.com/aurelioochoa/readmefetch"
Credits = "https://github.com/aurelioochoa/readmefetch/blob/main/CREDITS.md"

[tool.setuptools.package-data]
readmefetch = ["art/*/*", "web/*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E731", "B905"]  # zip() pairs lists of equal length by construction
