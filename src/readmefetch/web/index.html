<!doctype html>
<html lang="en" data-color-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>readmefetch</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="app-header">
  <a class="brand" id="brand" href="https://github.com/aurelioochoa/readmefetch" target="_blank" rel="noopener">
    <img src="/favicon.svg" alt="" width="24" height="24"> readmefetch
  </a>
  <span class="file-path" id="file-path"></span>
  <span class="spacer"></span>
  <label class="switch" title="Fetch {repos}, {stars}, {followers} and {contributions} from GitHub (cached for 10 minutes)">
    <input type="checkbox" id="live"> <span>Live GitHub numbers</span>
  </label>
  <button type="button" class="btn btn-sm" id="color-mode" aria-pressed="false">Light page</button>
  <button type="button" class="btn btn-sm btn-primary" id="save">Save</button>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="Settings">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="panel" id="panel" role="tabpanel"></div>
  </aside>

  <main class="main">
    <div class="flash" id="flash" role="status" hidden></div>

    <section class="box readme" aria-label="README preview">
      <div class="box-header">
        <svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 2.5h4.5c.8 0 1.5.7 1.5 1.5v9.5c0-.8-.7-1.5-1.5-1.5H2zm12 0H9.5C8.7 2.5 8 3.2 8 4v9.5c0-.8.7-1.5 1.5-1.5H14z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span id="readme-title">README.md</span>
        <span class="spacer"></span>
        <button type="button" class="btn btn-sm" id="replay" title="Play it again from the start, like a new visit">Replay</button>
      </div>
      <div class="box-body readme-body">
        <img id="preview" alt="Preview of the rendered SVG" hidden>
        <p class="placeholder" id="preview-empty">Rendering…</p>
        <p class="preview-badges" id="preview-badges" hidden></p>
      </div>
    </section>
    <p class="meta" id="meta"></p>

    <section class="box export" aria-labelledby="export-title">
      <div class="box-header"><h2 id="export-title">Export</h2></div>
      <div class="box-row">
        <div class="export-actions">
          <button type="button" class="btn" id="dl-svg">Download SVG</button>
          <button type="button" class="btn" id="dl-toml">Download readmefetch.toml</button>
          <button type="button" class="btn" id="copy-snippet">Copy README snippet</button>
          <button type="button" class="btn" id="copy-workflow">Copy GitHub Actions workflow</button>
          <button type="button" class="btn" id="copy-badge-lines" hidden>Copy badge lines</button>
        </div>
        <p class="hint">Put the SVG and <code>readmefetch.toml</code> in your profile repository (the one named after your
          username), paste the snippet into its README, and the workflow re-renders it every day.</p>
      </div>
      <div class="box-row">
        <h3>GIF</h3>
        <div class="gif-controls">
          <label>Frames per second
            <select class="form-select" id="gif-fps"><option>6</option><option>8</option><option selected>10</option><option>12</option><option>15</option></select>
          </label>
          <label>Sharpness
            <select class="form-select" id="gif-scale"><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
          </label>
          <label class="check"><input type="checkbox" id="gif-intro" checked> Include the intro</label>
          <button type="button" class="btn" id="gif-make">Make GIF</button>
        </div>
        <p class="hint" id="gif-status"></p>
        <div class="gif-result" id="gif-result" hidden>
          <img id="gif-img" alt="The exported GIF" hidden>
          <a class="btn" id="gif-download" download="readmefetch.gif">Download GIF</a>
        </div>
      </div>
    </section>
    <p class="footer-note" id="footer-note"></p>
  </main>
</div>

<dialog class="dialog" id="dialog">
  <form method="dialog" class="dialog-inner" id="dialog-form">
    <header class="dialog-header"><h2 id="dialog-title"></h2></header>
    <div class="dialog-body" id="dialog-body"></div>
    <footer class="dialog-footer" id="dialog-actions"></footer>
  </form>
</dialog>
</body>
</html>
